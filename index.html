<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fragmented Personality - Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            padding: 40px;
            min-height: 100vh;
            position: relative;
        }

        /* Эффект шума/зерна */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.07;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Заголовок */
        .page-title {
            color: #ff0000;
            font-size: 48px;
            font-family: 'Times New Roman', serif;
            text-align: center;
            margin-bottom: 50px;
            letter-spacing: 3px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .page-title:hover {
            opacity: 0.7;
            transform: scale(0.98);
        }

        /* Masonry Layout */
        .masonry-container {
            column-count: 5;
            column-gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Изображения */
        .masonry-item-static {
            break-inside: avoid;
            margin-bottom: 15px;
            overflow: hidden;
            border-radius: 8px;
            transition: all 0.3s ease;
            cursor: default;
        }

        .masonry-item-static:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .masonry-item-static img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            opacity: 0.85;
            transition: opacity 0.3s ease;
        }

        .masonry-item-static:hover img {
            opacity: 1;
        }

        /* МУЗЫКАЛЬНЫЙ ПЛЕЕР */
        .music-player {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: rgba(0, 0, 0, 0.9);
            border: 2px solid #ff0000;
            border-radius: 12px;
            padding: 15px 20px;
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s ease;
        }

        .music-player:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
        }

        .play-btn {
            width: 50px;
            height: 50px;
            background-color: #ff0000;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .play-btn:hover {
            background-color: #cc0000;
            transform: scale(1.1);
        }

        .play-btn svg {
            width: 20px;
            height: 20px;
            fill: #000000;
        }

        .visualizer {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 30px;
        }

        .visualizer-bar {
            width: 4px;
            background-color: #ff0000;
            border-radius: 2px;
            animation: visualize 0.5s ease-in-out infinite;
        }

        .visualizer-bar:nth-child(1) { animation-delay: 0s; height: 15px; }
        .visualizer-bar:nth-child(2) { animation-delay: 0.1s; height: 25px; }
        .visualizer-bar:nth-child(3) { animation-delay: 0.2s; height: 20px; }
        .visualizer-bar:nth-child(4) { animation-delay: 0.3s; height: 30px; }
        .visualizer-bar:nth-child(5) { animation-delay: 0.4s; height: 18px; }

        @keyframes visualize {
            0%, 100% { transform: scaleY(0.3); }
            50% { transform: scaleY(1); }
        }

        .music-player.paused .visualizer-bar {
            animation-play-state: paused;
            transform: scaleY(0.3);
        }

        .track-info {
            color: #ffffff;
            font-family: 'Times New Roman', serif;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .volume-icon {
            color: #ff0000;
            font-size: 18px;
        }

        .volume-slider {
            width: 80px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #333;
            border-radius: 2px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            background: #ff0000;
            border-radius: 50%;
            cursor: pointer;
        }

        .volume-slider::-moz-range-thumb {
            width: 12px;
            height: 12px;
            background: #ff0000;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        /* Адаптивность */
        @media (max-width: 1200px) {
            .masonry-container {
                column-count: 4;
            }
        }

        @media (max-width: 768px) {
            .masonry-container {
                column-count: 2;
            }
            
            .page-title {
                font-size: 32px;
            }

            .music-player {
                bottom: 20px;
                right: 20px;
                padding: 10px 15px;
            }

            .volume-control {
                display: none;
            }
        }
    </style>
</head>

    <!-- МУЗЫКАЛЬНЫЙ ПЛЕЕР -->

        <button class="play-btn" id="playBtn" onclick="togglePlay()">
            <svg id="playIcon" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
            </svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display: none;">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
        </button>
        
        <div class="visualizer">

        </div>

        <div class="volume-control">
            <span class="volume-icon">🔊</span>
            <input type="range" class="volume-slider" id="volumeSlider" 
                   min="0" max="1" step="0.1" value="0.5" 
                   onchange="setVolume(this.value)">
        </div>
        
        <!-- ПРАВИЛЬНЫЙ ПУТЬ К МУЗЫКЕ -->
        <audio id="audio" loop>
            <source src="ambient-music.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const musicPlayer = document.getElementById('musicPlayer');
        const volumeSlider = document.getElementById('volumeSlider');

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                musicPlayer.classList.remove('paused');
            } else {
                audio.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                musicPlayer.classList.add('paused');
            }
        }

        function setVolume(value) {
            audio.volume = value;
        }

        audio.volume = 0.5;

        window.addEventListener('load', () => {
            musicPlayer.style.opacity = '0';
            musicPlayer.style.transform = 'translateY(20px)';
            setTimeout(() => {
                musicPlayer.style.transition = 'all 0.5s ease';
                musicPlayer.style.opacity = '1';
                musicPlayer.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
