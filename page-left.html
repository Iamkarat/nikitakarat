  <style>
    :root {
      --gutter: clamp(22px, 7vw, 40px);
      --gap: clamp(14px, 2.5vw, 32px);
      --section: clamp(44px, 7vw, 88px);
      --line: rgba(0, 0, 0, .12);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; overflow-x: clip; }
    body { margin: 0; background: #fff; color: #000; font-family: Arial, Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
    img { display: block; width: 100%; height: auto; }
    ul { list-style: none; margin: 0; padding: 0; }
    figure { margin: 0; }

    /* Единая колонка: все блоки выровнены по одним краям */
    .page { width: min(1200px, 100% - 2 * var(--gutter)); margin: 0 auto; padding: 0 0 var(--section); display: grid; row-gap: var(--section); }

    /* Кадры 28:15 без обрезки */
    .stack { display: grid; row-gap: var(--gap); }
    .frame img { aspect-ratio: 28 / 15; object-fit: cover; background: #f4f4f4; }
    .tape img { aspect-ratio: 30 / 1; object-fit: cover; }

    /* Первые два кадра — во всю ширину окна */
    .stack--bleed { width: 100vw; margin-left: calc(50% - 50vw); row-gap: 0; }
    .stack--bleed .frame img { max-height: 60vh; }

    /* Галерея: карточки целиком, с подписями */
    .gallery { display: grid; row-gap: var(--gap); }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); }
    .card { cursor: zoom-in; }
    .card img { aspect-ratio: 1080 / 1380; object-fit: contain; transition: transform .35s ease; }
    .grid--bleed .card img { aspect-ratio: 888 / 1024; object-fit: cover; }
    @media (hover: hover) { .card:hover img { transform: translateY(-4px); } }

    /* Подпись */
    .note__text { margin: 0; font-size: clamp(22px, 2.4vw, 30px); font-weight: 300; line-height: 1.45; text-align: right; }
    .reveal { opacity: 0; transform: translateY(24px); transition: opacity .8s ease, transform .8s ease; }
    .reveal.is-visible { opacity: 1; transform: none; }

    /* Просмотр работы целиком */
    .viewer { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); background: rgba(255, 255, 255, .97); cursor: zoom-out; }
    .viewer.is-open { display: flex; }
    .viewer__img { width: auto; height: auto; max-width: 100%; max-height: 100%; object-fit: contain; }
    .viewer__close { position: absolute; top: max(8px, env(safe-area-inset-top)); right: 8px; width: 44px; height: 44px; border: 0; background: none; cursor: pointer; }
    .viewer__close::before, .viewer__close::after { content: ''; position: absolute; left: 10px; right: 10px; top: 21px; height: 2px; background: #000; transform: rotate(45deg); }
    .viewer__close::after { transform: rotate(-45deg); }
    .is-locked { overflow: hidden; }

    /* Колючая проволока: декоративный слой поверх страницы */
    body { position: relative; }
    .wires { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 5; }
    .wire { position: absolute; left: 0; top: 0; height: auto; color: #000; overflow: visible; transform-origin: 0 0; will-change: transform; }

    @media (max-width: 960px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid--bleed { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .grid { column-gap: 10px; }
      .grid--bleed { gap: 10px; }
      .tape img { aspect-ratio: 20 / 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
      .card img { transition: none; }
    }
  </style>

  <script>
    (function () {
      var items = document.querySelectorAll('.reveal');
      if (!('IntersectionObserver' in window)) {
        items.forEach(function (el) { el.classList.add('is-visible'); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { e.target.classList.add('is-visible'); io.unobserve(e.target); }
        });
      });
      items.forEach(function (el) { io.observe(el); });
    })();
    /* Колючая проволока: разбросана по белому фону и ползает, как муравьи, не заходя на изображения */
    (function () {
      var CRAWL = true;   // false — проволока лежит неподвижно
      var DENSITY = 1;    // больше — гуще, меньше — реже
      var GAP = 4;        // зазор между проволокой и изображением, px
      var layer = document.getElementById('wires');
      var NS = 'http://www.w3.org/2000/svg';
      var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
      var W = 0, H = 0, ants = [], blocks = [], seed;
      function rnd() {
        seed = (seed + 0x6D2B79F5) | 0;
        var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }
      /* Занятые области: кадры, ленты, работы с подписями (по реальным границам) и текст */
      function collect() {
        blocks = [];
        document.querySelectorAll('.frame, .tape, .card, .note').forEach(function (el) {
          var r = el.getBoundingClientRect();
          var x = r.left + scrollX, y = r.top + scrollY, b = [0, 0, 1, 1];
          if (el.dataset.box && getComputedStyle(el.firstElementChild).objectFit === 'contain') b = el.dataset.box.split(',').map(Number);
          blocks.push([x + r.width * b[0], y + r.height * b[1], x + r.width * b[2], y + r.height * b[3]]);
        });
      }
      /* Свободна ли точка для проволоки с запасом pad вокруг центра */
      function free(x, y, pad) {
        if (x < 2 || x > W - 2 || y < pad || y > H - pad) return false;
        for (var i = 0; i < blocks.length; i++) {
          var b = blocks[i];
          if (x > b[0] - pad && x < b[2] + pad && y > b[1] - pad && y < b[3] + pad) return false;
        }
        return true;
      }
      function place(a) {
        a.el.style.transform = 'translate(' + a.x.toFixed(1) + 'px,' + a.y.toFixed(1) + 'px) rotate(' + a.dir.toFixed(3) + 'rad) translate(-50%,-50%)';
      }
      function build() {
        W = layer.clientWidth; H = layer.clientHeight;
        seed = 2046; ants = []; layer.textContent = '';
        collect();
        var small = W < 700;
        var count = Math.min(260, Math.round(H / 1000 * (4.5 + W / 150) * DENSITY));
        for (var i = 0; i < count; i++) {
          var w = (small ? 16 : 30) + rnd() * (small ? 28 : 56), x, y, ok = false;
          for (var t = 0; t < 80 && !ok; t++) {
            if (t && t % 20 === 0) w *= .8;
            x = rnd() * W; y = rnd() * H;
            ok = free(x, y, w / 2 + GAP);
          }
          if (!ok) continue;
          var el = document.createElementNS(NS, 'svg');
          el.setAttribute('class', 'wire');
          el.setAttribute('viewBox', '0 0 120 24');
          el.setAttribute('width', w.toFixed(1));
          el.appendChild(document.createElementNS(NS, 'use')).setAttribute('href', '#wire');
          var a = { el: el, pad: w / 2 + GAP, x: x, y: y, dir: rnd() * Math.PI * 2, v: 5 + rnd() * 14, turn: 0 };
          place(a);
          layer.appendChild(el);
          ants.push(a);
        }
      }
      build();
      var timer;
      new ResizeObserver(function () {
        if (layer.clientWidth === W && layer.clientHeight === H) return;
        clearTimeout(timer);
        timer = setTimeout(build, 150);
      }).observe(layer);
      if (!CRAWL || still) return;
      var last = 0;
      function step(now) {
        var dt = Math.min(.05, (now - last) / 1000 || 0);
        last = now;
        var top = scrollY - 200, bottom = scrollY + innerHeight + 200;
        for (var i = 0; i < ants.length; i++) {
          var a = ants[i];
          if (a.y < top || a.y > bottom) continue;
          a.turn += (Math.random() - .5) * 6 * dt;
          a.turn *= .98;
          a.dir += a.turn * dt * 2;
          var nx = a.x + Math.cos(a.dir) * a.v * dt, ny = a.y + Math.sin(a.dir) * a.v * dt;
          if (free(nx, ny, a.pad)) { a.x = nx; a.y = ny; }
          else { a.dir += Math.PI + (Math.random() - .5) * 1.6; a.turn = 0; }
          place(a);
        }
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    })();
    /* Просмотр работы целиком по нажатию */
    (function () {
      var viewer = document.getElementById('viewer');
      var img = viewer.querySelector('.viewer__img');
      var opener = null;
      function open(card) {
        opener = card;
        img.src = card.querySelector('img').getAttribute('src').replace('/thumb/', '/');
        viewer.hidden = false;
        viewer.classList.add('is-open');
        document.documentElement.classList.add('is-locked');
        viewer.querySelector('.viewer__close').focus();
      }
      function close() {
        viewer.classList.remove('is-open');
        viewer.hidden = true;
        img.removeAttribute('src');
        document.documentElement.classList.remove('is-locked');
        if (opener) opener.focus();
      }
      document.querySelectorAll('.card').forEach(function (card) {
        card.tabIndex = 0;
        card.setAttribute('role', 'button');
        card.addEventListener('click', function () { open(card); });
        card.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(card); }
        });
      });
      viewer.addEventListener('click', close);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && viewer.classList.contains('is-open')) close();
      });
    })();
  </script>
